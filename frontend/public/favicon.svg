<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background App Icon Pill -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />

  <!-- Subtle glossy highlight on top border -->
  <rect x="2" y="2" width="60" height="30" rx="14" fill="white" fill-opacity="0.08" />

  <!-- Interview Video Camera Symbol -->
  <g filter="url(#glow)">
    <!-- Camera Body -->
    <rect x="13" y="20" width="24" height="24" rx="6" fill="#FFFFFF" />

    <!-- Camera Lens Cone -->
    <path d="M39 27.5 L50 21 C50.8 20.5 52 21.1 52 22.1 V41.9 C52 42.9 50.8 43.5 50 43 L39 36.5 V27.5 Z" fill="#FFFFFF" />

    <!-- Center AI Sparkle Core -->
    <circle cx="25" cy="32" r="5.5" fill="#7C3AED" />
    <circle cx="25" cy="32" r="2.5" fill="#38BDF8" />

    <!-- Sparkle Accent in corner -->
    <path d="M47 13 L48 16.5 L51.5 17.5 L48 18.5 L47 22 L46 18.5 L42.5 17.5 L46 16.5 Z" fill="url(#aiGlow)" />
  </g>
</svg>